<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efecto Matrix con Círculo Fluctuante</title>
    <style>
        body {
            background-color: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            position: relative; 
            overflow: hidden; 
        }

        #matrixBackground {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
        }

        .a1 {
            background-color: wheat;
            width: 500px;
            height: 300px;
            border-radius: 30px;
            position: absolute;
            bottom: 110px; 
            left: 50%;
            transform: translateX(-50%) rotate(0deg);
            transition: transform 0.8s ease-in-out; 
            z-index: 2; 
            box-shadow: 0 0 20px rgba(0, 255, 70, 0.2); 

            /* Centra el círculo rojo perfectamente dentro de la caja */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .a1:hover {
            transform: translateX(-50%) rotate(360deg);
        }

        /* Configuración del círculo rojo fluctuante (aprox. 2cm de diámetro) */
        .circulo-rojo {
            width: 75px;
            height: 75px;
            background-color: #90030372;
            border-radius: 50%;
            
            /* Animación infinita que hace fluctuar la luz cada 2 segundos */
            animation: fluctuacion 2s infinite ease-in-out;
        }

        /* Reglas de la animación para el efecto de luz y brillo */
        @keyframes fluctuacion {
            0% {
                opacity: 0.4;
                box-shadow: 0 0 10px rgba(143, 4, 6, 0.811);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 25px rgba(94, 3, 57, 0.9), 0 0 45px rgba(255, 0, 0, 0.6);
            }
            100% {
                opacity: 0.4;
                box-shadow: 0 0 10px rgba(103, 4, 4, 0.4);
            }
        }
    </style>
</head>
<body>

    <canvas id="matrixBackground"></canvas>

    <!-- Tu caja ahora contiene el círculo rojo en su interior -->
    <div class="a1">
        <div class="circulo-rojo"></div>
    </div>

    <script>
        const canvas = document.getElementById('matrixBackground');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const matrixChars = "ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const alphabet = matrixChars.split("");

        const fontSize = 16;
        let columns = canvas.width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0'; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                const x = i * fontSize;
                const y = rainDrops[i] * fontSize;

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        setInterval(drawMatrix, 30);
    </script>
</body>
</html>
