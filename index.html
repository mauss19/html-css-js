<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Ejercicios Web</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        background-color: #f0f2f5;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    header {
        width: 100%;
        max-width: 450px;
        background-color: #ffffff;
        padding: 30px 20px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 20px;
        color: #1a1a1a;
        font-size: 1.8rem;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    ul li a {
        display: block;
        padding: 12px 16px;
        background-color: #007bff;
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: background-color 0.2s, transform 0.1s;
    }

    ul li a:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
    }



    </style>
</head>
<body>
     <header>
    <h1>Mis Proyectos Web</h1>
    <ul>

        <li><a href="https://mauss19.github.io/html-css-js/html%20css%20js/calculadora4.html" target="_blank">Calculadora</a></li>

        <li><a href="https://mauss19.github.io/html-css-js/html%20css%20js/cronometro3.html" target="_blank">Cronómetro</a></li>
        <li><a href="https://mauss19.github.io/html-css-js/html%20css%20js/matrix2.html" target="_blank">Matrix</a></li>
        <li><a href="https://mauss19.github.io/html-css-js/html%20css%20js/bosstrap.html" target="_blank">Bootstrap</a></li>
    </ul>
</header>
</body>
</html>
